name: Validate flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the NixOS system closure (catches undefined packages, syntax errors)
        run: |
          nix build --extra-experimental-features 'nix-command flakes' \
            '.#nixosConfigurations.nixos.config.system.build.toplevel' \
            --no-link --show-trace

      - name: Check flake metadata is well-formed
        run: nix flake check --extra-experimental-features 'nix-command flakes' --no-build
