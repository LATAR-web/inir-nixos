name: "Auto-Update Flake (Sync inir)"

on:
  schedule:
    # Sincronización continua cada 2 horas
    - cron: "0 */2 * * *"
  repository_dispatch:
    types: [inir-updated, upstream-updated, trigger-update]
  workflow_dispatch: # Permite ejecutar la actualización manualmente desde GitHub

permissions:
  contents: write

jobs:
  update-flake:
    name: "Update inir flake input"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update inir input
        run: nix flake update inir --extra-experimental-features 'nix-command flakes'

      - name: Check flake after update
        run: nix flake check --no-build --extra-experimental-features 'nix-command flakes'

      - name: Commit and Push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(flake): sync inir update" || exit 0
          git push
