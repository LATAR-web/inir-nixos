name: "Auto-Update Flake (Daily Sync)"

on:
  schedule:
    # Se ejecuta 4 veces al día (cada 6 horas, 30 min tras la sincronización upstream)
    - cron: "30 */6 * * *"
  workflow_dispatch: # Permite ejecutar la actualización manualmente desde GitHub

permissions:
  contents: write

jobs:
  update-flake:
    name: "Update inir flake input"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update inir input
        run: nix flake update inir --extra-experimental-features 'nix-command flakes'

      - name: Check flake after update
        run: nix flake check --extra-experimental-features 'nix-command flakes'

      - name: Commit and Push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(flake): update inir from upstream" || exit 0
          git push
